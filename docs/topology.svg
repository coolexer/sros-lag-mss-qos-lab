<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="1" stop-color="#E3EBFC"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#124191"/>
      <stop offset="1" stop-color="#005AFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1F44" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1100" height="640" rx="16" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#0B1F44">SR OS access LAG + Multi-Service Site QoS lab</text>
  <text x="40" y="74" font-size="14" fill="#5A6478">SR-SIM 26.7.R2 &#183; 7750 SR-7 &#183; downstream traffic core &#8594; olt &#183; rates scaled 1:20</text>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="40" y="190" width="190" height="130" rx="12" fill="#FFFFFF" stroke="#124191" stroke-width="2"/>
  </g>
  <rect x="40" y="190" width="190" height="34" rx="12" fill="url(#hdr)"/>
  <rect x="40" y="210" width="190" height="14" fill="url(#hdr)"/>
  <text x="135" y="213" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">core</text>
  <text x="135" y="250" font-size="13" fill="#0B1F44" text-anchor="middle">traffic source</text>
  <text x="135" y="270" font-size="13" fill="#0B1F44" text-anchor="middle">iperf3 clients</text>
  <text x="135" y="296" font-size="12" fill="#5A6478" text-anchor="middle">VLAN per VPRN</text>

  <!-- bng chassis -->
  <g filter="url(#shadow)">
    <rect x="320" y="110" width="440" height="400" rx="14" fill="url(#chassis)" stroke="#124191" stroke-width="2"/>
  </g>
  <rect x="320" y="110" width="440" height="40" rx="14" fill="url(#hdr)"/>
  <rect x="320" y="134" width="440" height="16" fill="url(#hdr)"/>
  <text x="540" y="137" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">bng &#183; Nokia 7750 SR-7 (SR-SIM)</text>

  <!-- card 1 -->
  <rect x="345" y="170" width="390" height="110" rx="10" fill="#FFFFFF" stroke="#7FA2E8" stroke-width="1.5"/>
  <text x="362" y="196" font-size="14" font-weight="700" fill="#124191">card 1</text>
  <text x="418" y="196" font-size="12" fill="#5A6478">iom5-e &#183; me6-100gb-qsfp28</text>
  <text x="362" y="232" font-size="12" fill="#0B1F44">upstream port</text>
  <text x="362" y="262" font-size="12" fill="#0B1F44">extra LAG member (scenario B)</text>

  <!-- card 3 -->
  <rect x="345" y="300" width="390" height="190" rx="10" fill="#FFFFFF" stroke="#7FA2E8" stroke-width="1.5"/>
  <text x="362" y="326" font-size="14" font-weight="700" fill="#124191">card 3</text>
  <text x="418" y="326" font-size="12" fill="#5A6478">iom5-e &#183; me6-100gb-qsfp28</text>

  <!-- MSS box -->
  <rect x="362" y="345" width="240" height="126" rx="8" fill="#EAF1FF" stroke="#005AFF" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="376" y="368" font-size="13" font-weight="700" fill="#0B1F44">Multi-Service Site</text>
  <text x="376" y="388" font-size="12" fill="#0B1F44">MSS_93M_SITE-A &#183; ROOT 4650 kbps</text>
  <text x="376" y="408" font-size="12" fill="#0B1F44">SAPs lag-14:100.17 / .18 / .15</text>
  <line x1="376" y1="420" x2="588" y2="420" stroke="#B9CCF2"/>
  <text x="376" y="440" font-size="12" fill="#5A6478">100.11 / .13 / .16 &#183; SAP sched 5000 kbps</text>
  <text x="376" y="459" font-size="12" fill="#5A6478">200.* &#183; queue PIR 8000 kbps</text>

  <!-- ports on chassis -->
  <g font-size="12" fill="#0B1F44" text-anchor="end">
    <text x="728" y="254">1/1/c2/1</text>
    <text x="728" y="354">3/1/c1/1</text>
    <text x="728" y="384">3/1/c2/1</text>
    <text x="728" y="414">3/1/c3/1</text>
    <text x="728" y="444">3/1/c4/1</text>
  </g>
  <g fill="#124191">
    <rect x="339" y="224" width="12" height="12" rx="2"/>
    <rect x="729" y="244" width="12" height="12" rx="2" fill="#8A94A6"/>
    <rect x="729" y="344" width="12" height="12" rx="2"/>
    <rect x="729" y="374" width="12" height="12" rx="2"/>
    <rect x="729" y="404" width="12" height="12" rx="2" fill="#8A94A6"/>
    <rect x="729" y="434" width="12" height="12" rx="2" fill="#8A94A6"/>
  </g>

  <!-- core link -->
  <line x1="230" y1="230" x2="339" y2="230" stroke="#124191" stroke-width="3"/>
  <text x="284" y="220" font-size="12" fill="#0B1F44" text-anchor="middle">1/1/c1/1</text>
  <text x="284" y="250" font-size="11" fill="#5A6478" text-anchor="middle">dot1q</text>

  <!-- olt -->
  <g filter="url(#shadow)">
    <rect x="880" y="190" width="190" height="290" rx="12" fill="#FFFFFF" stroke="#124191" stroke-width="2"/>
  </g>
  <rect x="880" y="190" width="190" height="34" rx="12" fill="url(#hdr)"/>
  <rect x="880" y="210" width="190" height="14" fill="url(#hdr)"/>
  <text x="975" y="213" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">olt (access node)</text>
  <g font-size="12" fill="#0B1F44">
    <text x="900" y="254">eth3</text>
    <text x="900" y="354">eth1</text>
    <text x="900" y="384">eth2</text>
    <text x="900" y="414">eth4</text>
    <text x="900" y="444">eth5</text>
  </g>
  <rect x="948" y="300" width="108" height="160" rx="8" fill="#EAF1FF" stroke="#7FA2E8"/>
  <text x="1002" y="326" font-size="13" font-weight="700" fill="#0B1F44" text-anchor="middle">bond0</text>
  <text x="1002" y="346" font-size="11" fill="#5A6478" text-anchor="middle">802.3ad &#183; LACP</text>
  <text x="1002" y="364" font-size="11" fill="#5A6478" text-anchor="middle">layer3+4 hash</text>
  <text x="1002" y="392" font-size="11" fill="#0B1F44" text-anchor="middle">S-VLAN 100</text>
  <text x="1002" y="410" font-size="11" fill="#0B1F44" text-anchor="middle">C-VLAN per SAP</text>
  <text x="1002" y="438" font-size="11" fill="#5A6478" text-anchor="middle">iperf3 servers</text>
  <g fill="#124191">
    <rect x="874" y="244" width="12" height="12" rx="2" fill="#8A94A6"/>
    <rect x="874" y="344" width="12" height="12" rx="2"/>
    <rect x="874" y="374" width="12" height="12" rx="2"/>
    <rect x="874" y="404" width="12" height="12" rx="2" fill="#8A94A6"/>
    <rect x="874" y="434" width="12" height="12" rx="2" fill="#8A94A6"/>
  </g>

  <!-- access links -->
  <line x1="741" y1="250" x2="874" y2="250" stroke="#8A94A6" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="741" y1="350" x2="874" y2="350" stroke="#005AFF" stroke-width="3.5"/>
  <line x1="741" y1="380" x2="874" y2="380" stroke="#005AFF" stroke-width="3.5"/>
  <line x1="741" y1="410" x2="874" y2="410" stroke="#8A94A6" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="741" y1="440" x2="874" y2="440" stroke="#8A94A6" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- lag-14 bracket -->
  <ellipse cx="808" cy="365" rx="24" ry="32" fill="none" stroke="#005AFF" stroke-width="2"/>
  <rect x="779" y="306" width="58" height="20" rx="10" fill="#005AFF"/>
  <text x="808" y="320" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">lag-14</text>
  <text x="808" y="242" font-size="11" fill="#5A6478" text-anchor="middle">scenario B</text>
  <text x="808" y="482" font-size="11" fill="#5A6478" text-anchor="middle">scenario F</text>
  <text x="808" y="496" font-size="10" fill="#8A94A6" text-anchor="middle">(c3, c4)</text>

  <!-- legend -->
  <g font-size="12" fill="#0B1F44">
    <line x1="40" y1="560" x2="80" y2="560" stroke="#005AFF" stroke-width="3.5"/>
    <text x="90" y="564">lag-14 members at start (both on card 3)</text>
    <line x1="400" y1="560" x2="440" y2="560" stroke="#8A94A6" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="450" y="564">cabled, added to lag-14 by a scenario</text>
    <line x1="740" y1="560" x2="780" y2="560" stroke="#124191" stroke-width="3"/>
    <text x="790" y="564">upstream (one VLAN per VPRN)</text>
  </g>
  <text x="40" y="604" font-size="12" fill="#5A6478">Access LAG: mode access, encap qinq, LACP active &#183; baseline adapt-qos distribute &#183; scenarios D&#8211;F: distribute include-egr-hash-cfg + per-link-hash + per-fp-egr-queuing</text>
</svg>
