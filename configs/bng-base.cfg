edit-config private
/configure sfm 1 sfm-type m-sfm6-7/12
/configure system load-balancing l4-load-balancing true

/configure port 1/1/c1 admin-state enable connector breakout c1-10g
/configure port 1/1/c2 admin-state enable connector breakout c1-10g
/configure port 3/1/c1 admin-state enable connector breakout c1-10g
/configure port 3/1/c2 admin-state enable connector breakout c1-10g
/configure port 3/1/c3 admin-state enable connector breakout c1-10g
/configure port 3/1/c4 admin-state enable connector breakout c1-10g

/configure port 1/1/c1/1 admin-state enable ethernet mode hybrid encap-type dot1q
/configure port 3/1/c1/1 admin-state enable ethernet mode access encap-type qinq
/configure port 3/1/c2/1 admin-state enable ethernet mode access encap-type qinq
/configure port 1/1/c2/1 admin-state enable ethernet mode access encap-type qinq
/configure port 3/1/c3/1 admin-state enable ethernet mode access encap-type qinq
/configure port 3/1/c4/1 admin-state enable ethernet mode access encap-type qinq

/configure lag "lag-14" admin-state enable
/configure lag "lag-14" description "OLT-1"
/configure lag "lag-14" mode access
/configure lag "lag-14" encap-type qinq
/configure lag "lag-14" lacp mode active
/configure lag "lag-14" lacp administrative-key 100
/configure lag "lag-14" access adapt-qos mode distribute
/configure lag "lag-14" port 3/1/c1/1
/configure lag "lag-14" port 3/1/c2/1

# QoS: rates are 1:20 of production (93 Mbps -> 4.65 Mbps, 100 Mbps -> 5 Mbps).
# SR-SIM forwards at most 1000 pps per port (~10 Mbps at 1250 B), so every rate stays well below that.
/configure qos scheduler-policy "MSS_ROOT_OUT" tier 1 scheduler "ROOT" rate pir max
/configure qos scheduler-policy "SAP_100M_OUT" tier 1 scheduler "ROOT" rate pir 5000
/configure qos sap-ingress "mss-in" policy-id 10
/configure qos sap-egress "mss-out" policy-id 10
/configure qos sap-ingress "sap100m-in" policy-id 20
/configure qos sap-egress "sap100m-out" policy-id 20
/configure qos sap-ingress "default-in" policy-id 30
/configure qos sap-egress "default-out" policy-id 30
/configure qos sap-ingress "mss-in" description "MSS SAP ingress"
/configure qos sap-egress "mss-out" description "MSS SAP egress"
/configure qos sap-egress "mss-out" queue 1 scheduler-parent scheduler-name "ROOT"
/configure qos sap-ingress "sap100m-in" description "100M SAP ingress"
/configure qos sap-egress "sap100m-out" queue 1 scheduler-parent scheduler-name "ROOT"
/configure qos sap-ingress "default-in" description "default SAP ingress"
/configure qos sap-egress "default-out" queue 1 rate pir 8000

/configure service customer "2" customer-id 2
/configure service customer "2" description "Internal services"
/configure service customer "2" multi-service-site "MSS_93M_SITE-A" assignment port lag-14
/configure service customer "2" multi-service-site "MSS_93M_SITE-A" egress scheduler-policy policy-name "MSS_ROOT_OUT"
/configure service customer "2" multi-service-site "MSS_93M_SITE-A" egress scheduler-policy overrides scheduler "ROOT" rate pir 4650
/configure service customer "2" multi-service-site "MSS_93M_SITE-A" egress scheduler-policy overrides scheduler "ROOT" rate cir 4650

# --- VPRNs whose SAPs share one Multi-Service Site ---
/configure service vprn "1001" service-id 1001 customer "2" admin-state enable
/configure service vprn "1001" interface "to-core" ipv4 primary address 192.168.17.254 prefix-length 24
/configure service vprn "1001" interface "to-core" sap 1/1/c1/1:17
/configure service vprn "1001" interface "int_lag-14:100.17" ipv4 primary address 10.10.17.1 prefix-length 30
/configure service vprn "1001" interface "int_lag-14:100.17" sap lag-14:100.17 multi-service-site "MSS_93M_SITE-A"
/configure service vprn "1001" interface "int_lag-14:100.17" sap lag-14:100.17 ingress qos sap-ingress policy-name "mss-in"
/configure service vprn "1001" interface "int_lag-14:100.17" sap lag-14:100.17 egress qos sap-egress policy-name "mss-out"

/configure service vprn "1002" service-id 1002 customer "2" admin-state enable
/configure service vprn "1002" interface "to-core" ipv4 primary address 192.168.18.254 prefix-length 24
/configure service vprn "1002" interface "to-core" sap 1/1/c1/1:18
/configure service vprn "1002" interface "int_lag-14:100.18" ipv4 primary address 10.10.18.1 prefix-length 30
/configure service vprn "1002" interface "int_lag-14:100.18" sap lag-14:100.18 multi-service-site "MSS_93M_SITE-A"
/configure service vprn "1002" interface "int_lag-14:100.18" sap lag-14:100.18 ingress qos sap-ingress policy-name "mss-in"
/configure service vprn "1002" interface "int_lag-14:100.18" sap lag-14:100.18 egress qos sap-egress policy-name "mss-out"

/configure service vprn "1003" service-id 1003 customer "2" admin-state enable
/configure service vprn "1003" interface "to-core" ipv4 primary address 192.168.15.254 prefix-length 24
/configure service vprn "1003" interface "to-core" sap 1/1/c1/1:15
/configure service vprn "1003" interface "int_lag-14:100.15" ipv4 primary address 10.10.15.1 prefix-length 30
/configure service vprn "1003" interface "int_lag-14:100.15" sap lag-14:100.15 multi-service-site "MSS_93M_SITE-A"
/configure service vprn "1003" interface "int_lag-14:100.15" sap lag-14:100.15 ingress qos sap-ingress policy-name "mss-in"
/configure service vprn "1003" interface "int_lag-14:100.15" sap lag-14:100.15 egress qos sap-egress policy-name "mss-out"

# --- VPRN with SAP-level scheduler (100M -> 5M) ---
/configure service vprn "1004" service-id 1004 customer "2" admin-state enable
/configure service vprn "1004" interface "to-core" ipv4 primary address 192.168.22.254 prefix-length 24
/configure service vprn "1004" interface "to-core" sap 1/1/c1/1:22
/configure service vprn "1004" interface "int_lag-14:100.11" ipv4 primary address 10.10.11.1 prefix-length 30
/configure service vprn "1004" interface "int_lag-14:100.11" sap lag-14:100.11 ingress qos sap-ingress policy-name "sap100m-in"
/configure service vprn "1004" interface "int_lag-14:100.11" sap lag-14:100.11 egress qos sap-egress policy-name "sap100m-out"
/configure service vprn "1004" interface "int_lag-14:100.11" sap lag-14:100.11 egress qos scheduler-policy policy-name "SAP_100M_OUT"
/configure service vprn "1004" interface "int_lag-14:100.13" ipv4 primary address 10.10.13.1 prefix-length 30
/configure service vprn "1004" interface "int_lag-14:100.13" sap lag-14:100.13 ingress qos sap-ingress policy-name "sap100m-in"
/configure service vprn "1004" interface "int_lag-14:100.13" sap lag-14:100.13 egress qos sap-egress policy-name "sap100m-out"
/configure service vprn "1004" interface "int_lag-14:100.13" sap lag-14:100.13 egress qos scheduler-policy policy-name "SAP_100M_OUT"
/configure service vprn "1004" interface "int_lag-14:100.16" ipv4 primary address 10.10.16.1 prefix-length 30
/configure service vprn "1004" interface "int_lag-14:100.16" sap lag-14:100.16 ingress qos sap-ingress policy-name "sap100m-in"
/configure service vprn "1004" interface "int_lag-14:100.16" sap lag-14:100.16 egress qos sap-egress policy-name "sap100m-out"
/configure service vprn "1004" interface "int_lag-14:100.16" sap lag-14:100.16 egress qos scheduler-policy policy-name "SAP_100M_OUT"

# --- VPRN without MSS on 200.* ---
/configure service vprn "1005" service-id 1005 customer "1" admin-state enable
/configure service vprn "1005" interface "to-core" ipv4 primary address 192.168.200.254 prefix-length 24
/configure service vprn "1005" interface "to-core" sap 1/1/c1/1:200
/configure service vprn "1005" interface "int_lag-14:200" ipv4 primary address 10.10.200.254 prefix-length 24
/configure service vprn "1005" interface "int_lag-14:200" sap lag-14:200.* ingress qos sap-ingress policy-name "default-in"
/configure service vprn "1005" interface "int_lag-14:200" sap lag-14:200.* egress qos sap-egress policy-name "default-out"

exit all
commit
quit-config
